services:
  db:
    image: postgres:16-alpine
    container_name: tomos-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tomos_pos}
      POSTGRES_USER: ${POSTGRES_USER:-tomos_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tomos_pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tomos_pos} -d ${POSTGRES_DB:-tomos_pos}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tomos_pos_pgdata:
